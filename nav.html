<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        :root{
            --navcolor: rgb(179, 63, 183);
            --navbar:rgb(237, 130, 222);
            --fontcolor:purple;
        }
        .nev{
            background-color: var(--navcolor);
            
            height: 110px;
            padding: 10px 0px;
            
            
        }
        .navbar{
            display: flex;
            box-sizing: border-box;
            width: 80vw;
            height: 110px;
            background-color:var(--navbar);
            margin: 0px 10vw;
            border-radius: 30px;
            padding-top: 30px;
           
        }
        .navbar>ul{
            box-sizing: border-box;
            list-style: none;
            display: flex;
            width: 40vw;
            margin-left: 15vw ;
            margin-top: 14px;
            justify-content: center;
            
        }
        .navbar>ul>li{
            padding: 0px 60px;
            font-size: 20px;
            color: var(--fontcolor);
        }
        .navbar>a{
            margin-left: 30px;
        }

    </style>
</head>
<body>
    <div class="nev">
        <div class="navbar">
            <a href="nav.html"><img src="images (14).jpg" height="40" width="40px" alt=""></a>
            <ul >
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>

        </div>
    </div>
    
</body>
</html>
